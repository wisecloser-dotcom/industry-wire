<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Industry Wire</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Black and white. Colour only where it carries meaning: market up/down and Breaking. */
:root { --bg:#fff; --fg:#000; --mute:#666; --rule:#e5e5e5; --up:#17794f; --down:#c4342d; color-scheme:light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#fff; --mute:#999; --rule:#262626; --up:#5cc995; --down:#ff7a72; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) max(18px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(18px,env(safe-area-inset-left)); }
main { max-width:640px; margin:0 auto; }
a { color:inherit; text-underline-offset:3px; text-decoration-color:var(--mute); }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
header { padding:22px 0 14px; }
h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
.meta, .small { font-size:14px; color:var(--mute); }
.meta { margin:4px 0 0; }
#status { color:var(--down); }
#install { font-size:14px; color:var(--mute); margin:0 0 14px; }
.tape { display:flex; gap:22px; overflow-x:auto; padding:10px 0; border-block:1px solid var(--rule); font-variant-numeric:tabular-nums; scrollbar-width:none; }
.tape div { flex:none; font-size:14px; line-height:1.35; }
.tape b { display:block; font-size:17px; font-weight:600; }
.up { color:var(--up); } .down { color:var(--down); }
nav { position:sticky; top:0; background:var(--bg); display:flex; gap:16px; overflow-x:auto; padding:10px 0; font-size:14px; scrollbar-width:none; white-space:nowrap; }
nav a { color:var(--mute); text-decoration:none; }
h2 { font-size:13px; font-weight:600; color:var(--mute); margin:28px 0 0; padding-bottom:6px; border-bottom:1px solid var(--rule); scroll-margin-top:44px; }
ul { list-style:none; margin:0; padding:0; }
#brief li { padding:8px 0; }
article { padding:14px 0; border-bottom:1px solid var(--rule); }
h3 { font-size:17px; line-height:1.35; margin:0 0 4px; text-wrap:pretty; }
h3 .flag { font-size:13px; font-weight:600; margin-right:6px; }
article p { margin:0 0 6px; }
.why { color:var(--mute); font-size:15px; }
.src a { margin-right:12px; white-space:nowrap; display:inline-block; }
#week li { display:flex; gap:14px; padding:8px 0; border-bottom:1px solid var(--rule); }
#week .d { flex:none; width:58px; color:var(--mute); font-size:14px; font-variant-numeric:tabular-nums; }
#week .k { font-weight:600; }
footer { padding:24px 0 40px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Industry Wire</h1>
    <p class="meta"><span id="edition">Loading…</span> <button id="refresh" type="button">Refresh</button></p>
    <p class="meta" id="status" role="status"></p>
  </header>
  <p id="install" hidden></p>
  <div class="tape" id="tape" aria-label="Markets"></div>
  <h2>In brief</h2>
  <ul id="brief"></ul>
  <nav id="nav" aria-label="Industries"></nav>
  <div id="feed"></div>
  <h2>Week ahead</h2>
  <ul id="week"></ul>
  <footer class="small">Written by Claude from public reporting, three times a day. Not investment advice.</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
let loadedAt = 0;

function render(f) {
  const t = new Date(f.edition.updated);
  const mins = Math.round((Date.now() - t) / 6e4);
  const ago = mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
  $("edition").textContent = `${f.edition.label}, ${t.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })} (${ago}).`;

  $("tape").replaceChildren(...f.tape.map((x) => {
    const d = h("div"); d.append(x.name, h("b", x.val), h("span", (x.dir === "up" ? "▲ " : x.dir === "down" ? "▼ " : "") + x.chg, x.dir), h("br"), h("span", x.asof, "small"));
    return d;
  }));

  $("brief").replaceChildren(...f.bigpic.map((b) => { const li = h("li"); li.append(h("strong", b.b), " " + b.t); return li; }));

  const nav = [], feed = [];
  for (const s of f.sectors) {
    const items = f.stories.filter((x) => x.s === s.key);
    if (!items.length) continue;
    const a = h("a", s.name); a.href = "#" + s.key; nav.push(a);
    const sec = h("section"); sec.append(Object.assign(h("h2", s.name), { id: s.key }));
    for (const x of items) {
      const art = h("article"), h3 = h("h3");
      if (/breaking/i.test(x.tag)) h3.append(h("span", "Breaking", "flag down"));
      else if (x.new) h3.append(h("span", "New", "flag"));
      h3.append(x.h);
      const src = h("p", null, "src small");
      for (const [label, url, date] of x.src) if (/^https?:/.test(url)) src.append(Object.assign(h("a", `${label}, ${date}`), { href: url, target: "_blank", rel: "noopener" }));
      art.append(h3, h("p", x.sum), h("p", x.why, "why"), src);
      sec.append(art);
    }
    feed.push(sec);
  }
  $("nav").replaceChildren(...nav);
  $("feed").replaceChildren(...feed);

  $("week").replaceChildren(...f.week.map((w) => {
    const li = h("li"); li.append(h("span", `${w.dow} ${w.day} ${w.mon}`, "d"));
    const ev = h("span", w.ev, w.key ? "k" : ""); if (w.note) ev.append(h("br"), h("span", w.note, "small"));
    li.append(ev); return li;
  }));
}

async function load() {
  $("refresh").textContent = "Refreshing…";
  try {
    const r = await fetch("feed.json?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw r.status;
    render(await r.json());
    $("status").textContent = "";
    loadedAt = Date.now();
  } catch {
    $("status").textContent = "Couldn't load the latest edition. Check your connection and tap Refresh.";
  }
  $("refresh").textContent = "Refresh";
}

$("refresh").onclick = load;
document.onvisibilitychange = () => document.visibilityState === "visible" && Date.now() - loadedAt > 9e5 && load();

const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (!installed && /iPhone|iPad|Android/.test(navigator.userAgent)) {
  $("install").textContent = /Android/.test(navigator.userAgent)
    ? "To install: tap ⋮, then Add to Home screen."
    : "To install: tap Share, then Add to Home Screen.";
  $("install").hidden = false;
}
navigator.serviceWorker?.register("sw.js");
load();
</script>
</body>
</html>
